<!doctype html>
  <html lang="en">
  <head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ODR Pulse — Login</title>
<style>
:root{ color-scheme: light; --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781; --border:rgba(11,11,11,.10); --accent:#2a78d6; --accent-ink:#ffffff; --critical:#d03b3b; }
  @media (prefers-color-scheme: dark){ :root{ color-scheme: dark; --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --muted:#898781; --border:rgba(255,255,255,.12);} }
  *{box-sizing:border-box;}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:24px;}
.card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px;box-shadow:0 8px 24px rgba(11,11,11,.06);}
h1{font-size:20px;margin:0 0 4px;}
p.sub{color:var(--muted);font-size:13px;margin:0 0 20px;}
label{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:6px;}
input{width:100%;padding:11px 12px;border-radius:8px;border:1px solid var(--border);background:var(--page);color:var(--ink);font-size:14px;margin-bottom:14px;}
button{width:100%;padding:11px;border-radius:8px;border:none;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;cursor:pointer;}
button:disabled{opacity:.6;cursor:default;}
.err{color:var(--critical);font-size:13px;margin:-4px 0 14px;min-height:16px;}
.foot{margin-top:16px;text-align:center;font-size:13px;}
a{color:var(--accent);text-decoration:none;}
</style>
  </head>
  <body>
  <div class="card">
  <h1>ODR Pulse</h1>
  <p class="sub">Enter the password to view the dashboard.</p>
<form id="f">
<label for="pw">Password</label>
<input type="password" id="pw" autocomplete="current-password" required>
  <div class="err" id="err"></div>
  <button type="submit" id="btn">Unlock</button>
  </form>
  <div class="foot"><a href="/reset.html">Forgot password?</a></div>
  </div>
  <script>
  const f = document.getElementById('f');
const err = document.getElementById('err');
const btn = document.getElementById('btn');
f.addEventListener('submit', async (e) => {
  e.preventDefault();
err.textContent = '';
btn.disabled = true; btn.textContent = 'Checking…';
try {
const res = await fetch('/do-login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: document.getElementById('pw').value }) });
const data = await res.json();
if (res.ok) { location.href = '/'; }
else { err.textContent = data.error || 'Something went wrong.'; btn.disabled=false; btn.textContent='Unlock'; }
} catch(e2){ err.textContent = 'Network error.'; btn.disabled=false; btn.textContent='Unlock'; }
});
</script>
</body>
</html>
